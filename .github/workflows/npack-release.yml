name: npack Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  package:
    name: Build .npk
    runs-on: ubuntu-22.04
    steps:
      - name: Check out Post
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf build-essential

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache (post)
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.1

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm build

      - name: Build Post Linux binary
        run: cargo build --release --manifest-path src-tauri/Cargo.toml

      - name: Check out and build npack
        run: |
          git clone --depth 1 https://github.com/imattau/npack.git /tmp/npack-src
          cargo build --release --locked --manifest-path /tmp/npack-src/Cargo.toml
          echo "/tmp/npack-src/target/release" >> "$GITHUB_PATH"

      - name: Determine release version
        id: release
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create package root
        env:
          VERSION: ${{ steps.release.outputs.version }}
          PUBLISHER: ${{ vars.NOSTR_PUBLISHER }}
        run: |
          set -e
          mkdir -p package-root/bin package-root/.npack \
            package-root/share/applications \
            package-root/share/icons/hicolor/128x128/apps \
            package-root/share/metainfo \
            package-output
          install -m 0755 src-tauri/target/release/post package-root/bin/post
          cp flatpak/app.nostr.post.desktop package-root/share/applications/
          cp flatpak/app.nostr.post.png package-root/share/icons/hicolor/128x128/apps/
          cp flatpak/app.nostr.post.metainfo.xml package-root/share/metainfo/

          runtime_requires=$(npack inspect src-tauri/target/release/post \
            | awk '/^needed: / { sub(/^needed: /, ""); print }' \
            | jq -R -s 'split("\n") | map(select(length > 0))')

          jq -n \
            --arg publisher "$PUBLISHER" \
            --arg name post \
            --arg version "$VERSION" \
            --arg artifact "post-${VERSION}-linux-x86_64.npk" \
            --argjson runtime_requires "$runtime_requires" \
            --arg repo "https://github.com/${GITHUB_REPOSITORY}" \
            --arg commit "${GITHUB_SHA}" \
            '{publisher:$publisher,name:$name,version:$version,artifact:$artifact,sha256:"",dependencies:[],conflicts:[],repo:$repo,commit:$commit,os:"linux",arch:"x86_64",format:"npk",runtime_requires:$runtime_requires,provides:[],post_install:[]}' \
            > package-root/.npack/manifest.json

          npack pack package-root --output "package-output/post-${VERSION}-linux-x86_64.npk"

      - name: Create package manifest and hash
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          artifact="post-${VERSION}-linux-x86_64.npk"
          npack manifest "package-output/$artifact" \
            --output "package-output/post-${VERSION}.manifest.json"
          sha256sum "package-output/$artifact" > package-output/SHA256SUMS

      - name: Verify package output
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          artifact="package-output/post-${VERSION}-linux-x86_64.npk"
          expected=$(cut -d ' ' -f 1 package-output/SHA256SUMS)
          actual=$(sha256sum "$artifact" | cut -d ' ' -f 1)
          test "$expected" = "$actual"
          npack verify "package-output/post-${VERSION}.manifest.json"

      - name: Attest package provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: package-output/*.npk

      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: npack-release-bundle
          path: package-output
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          gh release upload "app-v${VERSION}" \
            package-output/*.npk \
            package-output/*.manifest.json \
            package-output/SHA256SUMS \
            --clobber

  nostr-handoff:
    name: Publish to Nostr
    needs: package
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/v')
    environment: release
    permissions:
      contents: read
    steps:
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check out and build npack
        run: |
          git clone --depth 1 https://github.com/imattau/npack.git /tmp/npack-src
          cargo build --release --locked --manifest-path /tmp/npack-src/Cargo.toml
          echo "/tmp/npack-src/target/release" >> "$GITHUB_PATH"

      - name: Download release bundle
        uses: actions/download-artifact@v4
        with:
          name: npack-release-bundle
          path: package-output

      - name: Publish artifact and events
        env:
          NOSTR_SECRET_KEY: ${{ secrets.NOSTR_SECRET_KEY }}
          NOSTR_RELAYS: ${{ vars.NOSTR_RELAYS }}
          NOSTR_BLOSSOM_SERVERS: ${{ vars.NOSTR_BLOSSOM_SERVERS }}
        run: |
          set -e
          test -n "$NOSTR_SECRET_KEY" || { echo "release environment must define NOSTR_SECRET_KEY" >&2; exit 1; }
          test -n "$NOSTR_RELAYS" || { echo "repository must define NOSTR_RELAYS" >&2; exit 1; }
          test -n "$NOSTR_BLOSSOM_SERVERS" || { echo "repository must define NOSTR_BLOSSOM_SERVERS" >&2; exit 1; }

          manifest=$(find package-output -maxdepth 1 -name '*.manifest.json' -print -quit)
          test -n "$manifest"

          relay_args=()
          while IFS= read -r relay; do
            [[ -z "${relay//[[:space:]]/}" ]] && continue
            relay_args+=(--relay "$relay")
          done <<< "$NOSTR_RELAYS"

          server_args=()
          while IFS= read -r server; do
            [[ -z "${server//[[:space:]]/}" ]] && continue
            server_args+=(--server "$server")
          done <<< "$NOSTR_BLOSSOM_SERVERS"

          npack publish "$manifest" \
            --secret-key "$NOSTR_SECRET_KEY" \
            "${relay_args[@]}" \
            "${server_args[@]}"
